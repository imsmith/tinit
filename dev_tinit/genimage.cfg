image efi-part.vfat {
	vfat {
		file EFI { image = "efi-part/EFI" }
		file bzImage { image = "bzImage" }
		file rootfs.cpio.gz { image = "rootfs.cpio.gz" }
	}
	size = 64M
}

image disk.img {
	hdimage { partition-table-type = "gpt" }
	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 32K
		bootable = true
	}
}
